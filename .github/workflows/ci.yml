name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check --output-format=github .
      - name: mypy
        run: mypy app

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      # The suite runs against mongomock by default; CI points it at a real
      # MongoDB so the unique indexes and aggregation pipelines are exercised
      # by the actual server, not an emulation of it.
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: pytest (mongomock)
        run: pytest -q --cov=app --cov-report=term-missing

      - name: pytest (real MongoDB)
        env:
          TEST_MONGO_URI: mongodb://localhost:27017/
        run: pytest -q

  smoke:
    name: Boot & seed
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      SECRET_KEY: ci-smoke-test-key-not-a-real-secret
      MONGO_URI: mongodb://localhost:27017/gardening_companion_ci
      MONGO_DB_NAME: gardening_companion_ci
      FLASK_ENV: development

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Bootstrap from an empty database
        run: |
          python manage.py ensure-indexes
          python manage.py seed-catalog
          python manage.py create-admin \
            --email ci@example.com --username ciadmin \
            --name "CI Admin" --password ci-smoke-password-1
          python manage.py check
          python manage.py routes

      - name: Serve and probe
        run: |
          gunicorn --bind 127.0.0.1:5000 --workers 1 wsgi:app &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5000/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5000/healthz | tee /dev/stderr | grep -q '"database": *"up"'
          curl -fsS http://127.0.0.1:5000/ > /dev/null
          curl -fsS http://127.0.0.1:5000/auth/login > /dev/null

      - name: Reminder sweep is a no-op on fresh data
        run: python manage.py send-reminders --dry-run

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gardening-companion:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts and answers /healthz
        run: |
          docker run -d --name gc -p 5000:5000 \
            -e SECRET_KEY=ci-key -e MONGO_URI=mongodb://127.0.0.1:27017/x \
            gardening-companion:ci
          sleep 8
          # Mongo is unreachable here on purpose: the app must still boot and
          # report itself degraded rather than crash-looping.
          docker logs gc
          curl -fsS http://127.0.0.1:5000/healthz || true
          docker inspect -f '{{.State.Running}}' gc | grep -q true
